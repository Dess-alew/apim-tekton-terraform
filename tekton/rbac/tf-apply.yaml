apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: terraform-apply
spec:
  params:
    - name: terraform-dir
      type: string
      default: "infra"
    - name: plan-file
      type: string
      default: "tfplan"
  workspaces:
    - name: source
  steps:
    - name: apply
      image: hashicorp/terraform:1.7
      workingDir: $(workspaces.source.path)/$(params.terraform-dir)
      envFrom:
        - secretRef:
            name: azure-credentials
      script: |
        #!/usr/bin/env sh
        set -e
        terraform apply -input=false -auto-approve $(params.plan-file)
        terraform output